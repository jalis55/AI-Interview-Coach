[project]
name = "ai-interview-coach"
version = "0.1.0"
description = "A job-description-focused interview coach using LangChain, Groq, and Tavily."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=1.4,<1.6.4",
    "langchain-groq>=1,<2",
    "langchain-tavily>=0.2,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "streamlit>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_interview_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
